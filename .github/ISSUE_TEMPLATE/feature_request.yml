name: Feature request
description: Suggest a focused improvement to AuraLAN
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve for AuraLAN users?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe a possible solution without assuming a specific implementation is required.
    validations:
      required: true
  - type: textarea
    id: local
    attributes:
      label: Local-first considerations
      description: Does this require cloud access, external services, credentials, host changes, or new network writes?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: I have described the problem, not only a preferred UI or implementation.
          required: true
