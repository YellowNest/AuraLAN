name: CI

on:
  push:
    branches: [main, dev, "release/**", "feature/**"]
  pull_request:
    branches: [main, dev, "feature/**"]

permissions:
  contents: read

# Only the newest revision of a development branch needs full validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate repository
        run: python scripts/validate-release.py

      - name: Audit reachable history
        run: python scripts/audit-history.py

      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  smoke:
    name: Generic Linux smoke boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Boot and exercise status API
        run: |
          set -euo pipefail
          export AURALAN_DATA_DIR="$RUNNER_TEMP/auralan-state"
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8878 >"$RUNNER_TEMP/auralan-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8878"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base + "/api/v1/status", timeout=2) as response:
                      status = json.load(response)
                  with urllib.request.urlopen(base + "/api/v1/health", timeout=2) as response:
                      health = json.load(response)
                  with urllib.request.urlopen(base + "/api/v1/notifications", timeout=2) as response:
                      notifications = json.load(response)
                  monitor = status.get("monitor", {})
                  if (
                      response.status == 200
                      and health.get("ok") is True
                      and isinstance(status.get("devices"), list)
                      and monitor.get("enabled") is True
                      and monitor.get("running") is True
                      and notifications.get("configured") is False
                  ):
                      print(
                          "Smoke OK:",
                          f"system={status.get('system', {}).get('state', 'unknown')}",
                          f"devices={len(status['devices'])}",
                          f"monitor={monitor.get('interval_seconds')}s",
                      )
                      break
              except (OSError, ValueError, urllib.error.URLError) as exc:
                  last_error = exc
              time.sleep(0.5)
          else:
              raise SystemExit(f"AuraLAN smoke boot failed: {last_error}")
          PY

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install audit tool
        run: python -m pip install pip-audit

      - name: Audit runtime requirements
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax checks
        run: |
          find frontend scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -n1 node --check

      - name: Frontend tests
        run: node --test frontend/tests/*.test.mjs


  browser:
    name: Browser sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Boot AuraLAN and run responsive browser checks
        run: |
          export AURALAN_DATA_DIR="$RUNNER_TEMP/auralan-browser-state"
          export AURALAN_KNOWN_ACCESS_POINTS='[{"ssid":"Fixture Wi-Fi","address":"192.0.2.1","label":"Fixture router"},{"ssid":"Workshop Wi-Fi","address":"192.0.2.5"}]'
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8878 >"$RUNNER_TEMP/auralan-browser.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8878/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/auralan-browser.log"
              exit 1
            fi
            sleep 0.5
          done

          AURALAN_URL=http://127.0.0.1:8878 bash scripts/test-ui.sh
