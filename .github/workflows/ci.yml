name: CI

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate repository
        run: python scripts/validate-release.py

      - name: Audit reachable history
        run: python scripts/audit-history.py

      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Dependency consistency
        run: python -m pip check

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install audit tool
        run: python -m pip install pip-audit

      - name: Audit runtime requirements
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Syntax checks
        run: |
          find frontend scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -n1 node --check

      - name: Frontend tests
        run: node --test frontend/tests/*.test.mjs
