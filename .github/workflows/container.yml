name: Container

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yaml"
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - "project.json"
      - ".github/workflows/container.yml"
  pull_request:
    branches: [main, dev, "feature/**"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yaml"
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - "project.json"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded builds so an older push cannot overwrite a newer dev tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose files
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config >/dev/null
          DOCKER_GID=999 docker compose -f compose.yaml -f compose.docker-socket.yaml config >/dev/null
          PIHOLE_GID=999 docker compose -f compose.yaml -f compose.pihole.yaml config >/dev/null
          DOCKER_GID=999 PIHOLE_GID=998 docker compose -f compose.yaml -f compose.docker-socket.yaml -f compose.pihole.yaml config >/dev/null

      - name: Build native-architecture image
        run: docker build --pull --tag ghcr.io/yellownest/auralan:latest .

      - name: Verify hardened Compose deployment
        run: |
          set -euo pipefail
          export AURALAN_PORT=8878

          cleanup() {
            docker compose down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose up -d --pull never

          test "$(docker exec auralan id -u)" = "10001"
          test "$(docker exec auralan id -g)" = "10001"

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8878/api/v1/health >health.json &&
               curl -fsS http://127.0.0.1:8878/api/v1/status >status.json; then
              python -c 'import json; h=json.load(open("health.json", encoding="utf-8")); s=json.load(open("status.json", encoding="utf-8")); assert h.get("ok") is True; assert isinstance(s.get("devices"), list); print("AuraLAN container smoke OK:", h.get("version"), "devices=", len(s["devices"]))'
              exit 0
            fi
            sleep 0.5
          done

          docker compose logs auralan
          exit 1

  multiarch:
    name: Multi-arch build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64/ARM64 without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  browser:
    name: Browser release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt

      - name: Boot isolated API and verify responsive UI
        shell: bash
        run: |
          set -euo pipefail
          export AURALAN_DATA_DIR="$RUNNER_TEMP/auralan-browser-state"
          export AURALAN_KNOWN_ACCESS_POINTS='[{"ssid":"Fixture Wi-Fi","address":"192.0.2.1","label":"Fixture router"},{"ssid":"Workshop Wi-Fi","address":"192.0.2.5"}]'
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8878 >"$RUNNER_TEMP/auralan-browser.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8878/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/auralan-browser.log"
              exit 1
            fi
            sleep 0.5
          done
          AURALAN_URL=http://127.0.0.1:8878 bash scripts/test-ui.sh

  publish:
    name: Publish multi-arch image
    needs: [smoke, multiarch, browser]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v1.6.1-network-pulse' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and validate AuraLAN version
        id: project
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("project.json", encoding="utf-8"))["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Release tag v$tag_version does not match project.json version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/yellownest/auralan
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/feature/v1.6.1-network-pulse' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=AuraLAN
            org.opencontainers.image.description=Local-first LAN inventory and network monitoring
            org.opencontainers.image.version=${{ steps.project.outputs.version }}

      - name: Build and publish AMD64/ARM64
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AURALAN_VERSION=${{ steps.project.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify public multi-arch published image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v1.6.1-network-pulse'
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          tag=latest
          if [[ "$GITHUB_REF" == refs/heads/feature/v1.6.1-network-pulse ]]; then tag=dev; fi
          docker buildx imagetools inspect --raw "ghcr.io/yellownest/auralan:$tag" >manifest.json
          python -c 'import json; d=json.load(open("manifest.json", encoding="utf-8")); a={m.get("platform",{}).get("architecture") for m in d.get("manifests",[]) if m.get("platform",{}).get("os")=="linux"}; missing={"amd64","arm64"}-a; assert not missing, f"missing architectures: {sorted(missing)}"; print("Public GHCR manifest OK:", sorted(a))'
