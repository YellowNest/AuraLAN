services:
  auralan:
    image: ghcr.io/yellownest/auralan:latest
    container_name: auralan
    network_mode: host
    restart: unless-stopped
    environment:
      AURALAN_DATA_DIR: /data
      AURALAN_HOST: "${AURALAN_HOST:-0.0.0.0}"
      AURALAN_PORT: "${AURALAN_PORT:-8787}"
      AURALAN_KNOWN_ACCESS_POINTS: "${AURALAN_KNOWN_ACCESS_POINTS:-}"
      AURALAN_HOST_PROC: /host/proc
      AURALAN_HOST_SYS: /host/sys
      AURALAN_HOSTNAME_FILE: /host/etc/hostname
      AURALAN_HOSTS_FILE: /host/etc/hosts
    volumes:
      - auralan-data:/data
      - /proc/uptime:/host/proc/uptime:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/hosts:/host/etc/hosts:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auralan-data:
